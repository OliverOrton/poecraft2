[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poecraft-engine"
version = "0.1.0"
description = "Python bindings for the poecraft2 native crafting engine"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["poecraft_engine*"]

[tool.setuptools.package-data]
poecraft_engine = ["*.dll", "*.so", "*.dylib"]
