[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poecraft-economy"
version = "0.1.0"
description = "Canonical multi-league economy ingest and publication for poecraft2"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
poecraft-economy = "poecraft_economy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poecraft_economy*"]
