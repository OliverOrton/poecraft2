name: Windows

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PYTHONPATH: tools/ingest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify required validation
        id: changes
        shell: pwsh
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONPATH: tools/ingest
        run: python -m poecraft_ingest.ci_changes --base "$env:CHANGE_BASE" --output "$env:GITHUB_OUTPUT"
      - name: Native validation not run
        if: steps.changes.outputs.native_required == 'false'
        shell: pwsh
        run: Write-Output 'Only known documentation paths changed. Solver knowledge checks validate the affected layer; native build/tests were not run. This supplies no native or policy-quality qualification; release requires matching prior evidence.'
      - name: Bind project Python and install test dependencies
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        run: |
          $selectedPython = (Get-Command python).Source
          "POECRAFT_PYTHON=$selectedPython" >> $env:GITHUB_ENV
          & $selectedPython -m pip install -e './tools/ingest[test]'
          if ($LASTEXITCODE -ne 0) { throw 'Project test dependency installation failed.' }
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.native_required == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: msys2/setup-msys2@v2
        if: steps.changes.outputs.native_required == 'true'
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure UCRT64 tool paths
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64/bin'
          "POECRAFT_CMAKE=$(Join-Path $bin 'cmake.exe')" >> $env:GITHUB_ENV
          "POECRAFT_NINJA=$(Join-Path $bin 'ninja.exe')" >> $env:GITHUB_ENV
          "POECRAFT_CC=$(Join-Path $bin 'gcc.exe')" >> $env:GITHUB_ENV
          "POECRAFT_CXX=$(Join-Path $bin 'g++.exe')" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - name: Build
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/build.ps1 -Jobs 2
      - name: Prepare frozen data
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        timeout-minutes: 11
        run: python -m poecraft_ingest.ci_validation --scope Prepare --output "build/validation/stages/${{ github.run_id }}-${{ github.run_attempt }}/Prepare"
      - name: Python tests
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        timeout-minutes: 21
        run: python -m poecraft_ingest.ci_validation --scope Python --output "build/validation/stages/${{ github.run_id }}-${{ github.run_attempt }}/Python"
      - name: Native tests
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        timeout-minutes: 16
        run: python -m poecraft_ingest.ci_validation --scope Native --output "build/validation/stages/${{ github.run_id }}-${{ github.run_attempt }}/Native"
      - name: Web and real WASM tests
        if: steps.changes.outputs.native_required == 'true'
        shell: pwsh
        timeout-minutes: 11
        run: python -m poecraft_ingest.ci_validation --scope Web --output "build/validation/stages/${{ github.run_id }}-${{ github.run_attempt }}/Web"
      - name: Preserve staged validation evidence
        if: always() && steps.changes.outputs.native_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-stages
          path: |
            build/validation/stages/
            build/engine/Testing/Temporary/LastTest.log
            build/engine/Testing/Temporary/LastTestsFailed.log
            build/validation/runtime-identity-*.json
          if-no-files-found: warn
      - name: Preserve frozen runtime identity failure
        if: failure() && steps.changes.outputs.native_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-runtime-identity-failure
          path: build/validation/runtime-identity-*.json
          if-no-files-found: ignore
      - name: Preserve native test failure
        if: failure() && steps.changes.outputs.native_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-test-failure
          path: |
            build/engine/Testing/Temporary/LastTest.log
            build/engine/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
