name: Solver knowledge

on:
  push:
  pull_request:

jobs:
  knowledge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Traceability and focused tooling checks
        env:
          PYTHONPATH: tools/ingest
          KNOWLEDGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m poecraft_ingest.solver_knowledge lint
          if git cat-file -e "$KNOWLEDGE_BASE:docs/solver/claims.md" 2>/dev/null; then
            python -m poecraft_ingest.solver_knowledge lint --base "$KNOWLEDGE_BASE"
          else
            echo 'No previous claim ledger is available; append-only comparison is not applicable.'
          fi
          python -m unittest discover -s tools/ingest/tests -p test_solver_knowledge.py
          python -m pytest tools/ingest/tests/test_solver_reports.py -q
          python -m poecraft_ingest.solver_knowledge check-metadata experiments/solver-research/backbone-pilot-v1.json
